# PARSeq short text crops (reader: parseq_handwritten), docTR recogniser.
name: parseq
reader: parseq_handwritten
method: full
dataset_kind: line
base_model: parseq
base_model_source: hf_cache
framework: torch
install_extra: train
seed: 0
epochs: 20
batch_size: 32
learning_rate: 0.0001
weight_decay: 0.0001
max_target_length: 32
image_size: [32, 128]
min_vram_gb: 4
min_ram_gb: 8
output_subdir: parseq
notes: Base weights come from DOCTR_CACHE_DIR (see docs/SETUP.md).
