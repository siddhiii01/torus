# Interim DEB client template converted from schemas/deb/
# (excel_columns.json + field_groups.json). Sheet: "56 accounts".
# Replaced by the real client Excel once shared (P8.1).
# Row alignment key (P1.2): (person_key, address_type, address_source);
# see schemas/deb/row_key.md.
id: deb_v1
version: 1
description: >
  Interim DEB template (73 columns from schemas/deb). Scored fields are
  filled by the engine; passthrough columns are ops/system and must not be
  extracted. Critical identity and contact fields require multi-reader
  agreement.


row_key:
  primary:
    - sources: [person_name, customer_name]
      normalize: person
    - sources: [address_type]
      normalize: address_type
    - sources: [address_source]
      normalize: address_source
      aliases:
        applicationform:
          - application form
          - application_form
          - Application form
          - Application Form
          - ApplicationForm
          - Applicationform
        voterid:
          - voter id
          - voter_id
          - Voterid
          - Voter id
          - Voter ID
          - VoterId
        rationcard:
          - ration card
          - ration_card
          - Rationcard
          - Ration card
          - Ration Card
        aadhaarcard:
          - aadhaar card
          - aadhaar
          - Aadhaarcard
          - Aadhaar card
          - Aadhaar
        dl:
          - driving licence
          - driving license
          - DL
          - Driving Licence
          - Driving License
        agreement_of_guarantee:
          - agreement of guarantee
          - aggreement of guarantee
          - aggrement of guarantee
          - agreement of gurantee
          - Agreement of Guarantee
          - Aggreement of Guarantee
          - Aggrement of Guarantee
          - Agreement Of Gurantee
        dpn:
          - DPN
        guarantor_form:
          - guarantor's form
          - guarantor form
          - Guarantor's form
          - Guarantor form
  disambiguator:
    sources: [address_line1]
    normalize: text
  fuzzy_threshold: 0.8

fields:
  - key: bank_lan
    excel_header: "Bank Lan"
    excel_col: 1
    description: "Bank loan account number (LAN) for this pack."
    type: text
    charset: alphanumeric
    validators: []
    look_in: []
    cardinality: per_pack
    critical: false
    match: exact
    passthrough: true

  - key: system_lan
    excel_header: "SYSTEM_LAN"
    excel_col: 2
    description: "System loan account number for this pack."
