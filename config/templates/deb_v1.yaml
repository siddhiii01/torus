  - key: bank_lan_dup
    excel_header: "Bank Lan"
    excel_col: 5
    description: "Duplicate Bank Lan column (mirrors bank_lan)."
    type: text
    charset: alphanumeric
    validators: []
    look_in: []
    cardinality: per_pack
    critical: false
